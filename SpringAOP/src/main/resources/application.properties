spring.application.name=SpringAOP

# JDBC URL
spring.datasource.url=jdbc:mysql://localhost:3306/EmpSchema?useSSL=false&serverTimezone=UTC

# Database credentials
spring.datasource.username=root
spring.datasource.password=Pooja@Root29

# JDBC driver (optional, auto-detected)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate dialect for MySQL (optional)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Show SQL statements in console
spring.jpa.show-sql=true

# Format SQL
spring.jpa.properties.hibernate.format_sql=true

# DDL auto options: create, create-drop, update, validate, none
spring.jpa.hibernate.ddl-auto=update


